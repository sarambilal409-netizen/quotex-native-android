name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Everything
        run: |
          echo "--- Before ---"
          ls -la
          echo "--- Unzipping ---"
          for z in *.zip; do
            echo "Unzipping $z"
            unzip -o "$z"
          done
          rm -f *.zip
          echo "--- After Unzip ---"
          ls -la
          echo "--- Deep List ---"
          ls -R | head -n 150

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          # Gradlew dhoondo
          GRADLEW_PATH=$(find. -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            PROJECT_ROOT=$(find. -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          else
            PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          fi
          echo "PROJECT ROOT: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          pwd
          ls -la
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quotex-Signal-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
