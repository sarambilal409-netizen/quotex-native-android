name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Everything
        run: |
          ls -la
          for z in *.zip; do unzip -o "$z"; done
          rm -f *.zip
          ls -la
          echo "--- checking files ---"
          ls -R | head -n 100

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          echo "Finding project..."
          ROOT=$(pwd)
          # find gradlew
          GPATH=$(find $ROOT -name "gradlew" -type f 2>/dev/null | head -n 1)
          echo "Gradlew path: $GPATH"
          if [ -n "$GPATH" ]; then
            PDIR=$(dirname "$GPATH")
          else
            PDIR=$(find $ROOT -name "settings.gradle" -type f 2>/dev/null | head -n 1 | xargs dirname 2>/dev/null)
          fi
          if [ -z "$PDIR" ]; then PDIR="."; fi
          if [[ "$PDIR" == */app ]]; then PDIR=$(dirname "$PDIR"); fi
          echo "Project Dir: $PDIR"
          cd "$PDIR"
          pwd
          ls -la
          if [ -f "gradlew" ]; then
            chmod +x gradlew
           ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quotex-Signal-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
