name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Find Project
        run: |
          unzip -o *.zip || true
          rm -f *.zip
          echo "--- After Unzip ---"
          ls -la
          echo "--- Finding build.gradle ---"
          find. -type f -name "*.gradle" | head -20
          # Project root dhoondo jahan settings.gradle hai
          PROJECT_DIR=$(find. -type f -name "settings.gradle*" | head -n 1 | xargs dirname 2>/dev/null || true)
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR=$(find. -type f -name "build.gradle*" | head -n 1 | xargs dirname 2>/dev/null || true)
          fi
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR="."; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project at: $PROJECT_DIR"
          ls -la $PROJECT_DIR

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pwd
          ls -la
          if [ -f "gradlew" ]; then
            chmod +x gradlew
           ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quotex-Signal-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
