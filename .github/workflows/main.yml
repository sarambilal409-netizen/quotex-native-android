name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -o *.zip || true
          # Check if folder exists and move files
          if [ -d "quotex_native_android" ]; then
            mv quotex_native_android/*. || true
            mv quotex_native_android/.*. 2>/dev/null || true
            rm -rf quotex_native_android
          fi
          rm -f *.zip
          ls -la

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          ls -la
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quotex-Signal-APK
          path: app/build/outputs/apk/debug/*.apk
