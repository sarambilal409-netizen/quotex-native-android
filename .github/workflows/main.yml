name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Everything
        run: |
          ls -la
          for z in *.zip; do
            echo "Unzipping $z"
            unzip -o "$z"
          done
          rm -f *.zip
          echo "--- After Unzip ---"
          ls -la
          echo "--- Deep List ---"
          find. -maxdepth 3 -type f -name "build.gradle*" | head -20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          GRADLEW_PATH=$(find. -name "gradlew" -type f | head -n 1)
          echo "Gradlew at: $GRADLEW_PATH"
          if [ -z "$GRADLEW_PATH" ]; then
            PROJECT_ROOT=$(find. -name "settings.gradle" | head -n 1 | xargs dirname)
            if [ -z "$PROJECT_ROOT" ]; then
              PROJECT_ROOT=$(find. -name "build.gradle" | head -n 1 | xargs dirname)
            fi
          else
            PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          fi
          if [ -z "$PROJECT_ROOT" ]; then PROJECT_ROOT="."; fi
          if [[ "$PROJECT_ROOT" == */app ]]; then
            PROJECT_ROOT=$(dirname "$PROJECT_ROOT")
          fi
          echo "PROJECT ROOT: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          pwd
          ls -la
          if [ -f "gradlew" ]; then
            chmod +x gradlew
           ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quotex-Signal-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
