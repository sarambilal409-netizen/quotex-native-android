name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: |
          unzip -o quotex_native_android.zip
          rm -f quotex_native_android.zip
          # folder se files bahar nikalo
          if [ -d "quotex_native_android" ]; then
            mv quotex_native_android/*. -f
            rmdir quotex_native_android || true
          fi
          ls -la
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quotex-Signal-APK
          path: app/build/outputs/apk/debug/app-debug.apk
